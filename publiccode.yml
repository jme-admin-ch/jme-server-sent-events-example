description:
  en:
    localisedName: JME Server-Sent Events Example
    shortDescription: Example applications demonstrating anonymous and authenticated server-sent events with jEAP.
    longDescription: >
      This project demonstrates how Spring Boot applications publish resource mutations through Kafka and expose them
      to Angular frontends as server-sent events. It includes anonymous and OAuth2-protected SSE variants, a local OAuth2
      mock server, Docker Compose infrastructure, and browser integration tests covering CRUD and push-driven refresh.
    features:
      - Demonstrates anonymous and OAuth2-protected server-sent event streams
      - Connects PostgreSQL resource mutations to SSE through Kafka
      - Includes Angular frontends, local OAuth2 support, and browser integration tests
